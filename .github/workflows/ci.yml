name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install validation dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint Python
        run: ruff check src scripts tests
      - name: Compile source
        run: python -m compileall -q src scripts tests
      - name: Run deterministic tests
        run: python -m pytest -q
      - name: Build package
        run: python -m build
      - name: Smoke-test wheel outside checkout
        run: |
          python -m venv --system-site-packages /tmp/fmri-sae-wheel
          /tmp/fmri-sae-wheel/bin/pip install --no-deps --force-reinstall dist/*.whl
          cd /tmp
          /tmp/fmri-sae-wheel/bin/fmri-sae-correspondence --version
          /tmp/fmri-sae-wheel/bin/fmri-sae-correspondence config validate
          /tmp/fmri-sae-wheel/bin/fmri-sae-correspondence results verify
      - name: Validate documentation
        run: |
          python scripts/check_markdown_links.py
      - name: Verify source and aggregate catalogs
        run: ./verify.sh evidence/power
