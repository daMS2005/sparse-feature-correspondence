[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fmri-sae-correspondence"
version = "0.1.4"
description = "Reproducible analyses of sparse-feature correspondence between language models and fMRI responses"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Daniel Mora"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy==2.1.2",
  "PyYAML==6.0.2",
  "scipy==1.17.1",
]

[project.optional-dependencies]
models = [
  "huggingface-hub==1.9.0",
  "python-dotenv==1.2.2",
  "tokenizers==0.22.2",
  "torch==2.5.1",
  "transformers==5.5.0",
]
brain = [
  "nibabel==5.4.2",
  "nilearn==0.13.1",
  "pandas==3.0.2",
  "spacy==3.8.11",
]
figures = ["matplotlib==3.10.5"]
dev = [
  "build==1.3.0",
  "pytest==8.4.2",
  "ruff==0.12.12",
]
full = [
  "huggingface-hub==1.9.0",
  "matplotlib==3.10.5",
  "nibabel==5.4.2",
  "nilearn==0.13.1",
  "pandas==3.0.2",
  "python-dotenv==1.2.2",
  "spacy==3.8.11",
  "tokenizers==0.22.2",
  "torch==2.5.1",
  "transformers==5.5.0",
]

[project.scripts]
fmri-sae-correspondence = "fmri_sae_correspondence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.data-files]
"share/fmri-sae-correspondence" = ["configs/analysis.yaml"]
"share/fmri-sae-correspondence/evidence/power" = ["evidence/power/*.json"]
"share/fmri-sae-correspondence/results" = [
  "results/power_summary.json",
  "results/power_summary_table.tex",
  "results/power_summary_macros.tex",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "integration: requires private data, model weights, or external services",
]
